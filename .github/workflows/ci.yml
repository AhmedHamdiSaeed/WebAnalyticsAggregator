name: Build & Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore WebAnalyticsAggregator.sln

    - name: Build Solution
      run: dotnet build WebAnalyticsAggregator.sln --configuration Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test WebAnalyticsAggregator.sln --configuration Release --no-build --verbosity normal
      
    - name: Verify Docker Compose Configuration
      run: docker-compose config
